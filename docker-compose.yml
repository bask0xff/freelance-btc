services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-freelance_btc}
    ports:
      - "5436:5432"   # host:5436 -> container:5432 (5432/5433/5435 у вас уже заняты другими проектами)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      # ВАЖНО: bitcoind у вас уже запущен ВНЕ докера (на хосте).
      # host.docker.internal позволяет контейнеру достучаться до RPC на хосте.
      BTC_RPC_HOST: ${BTC_RPC_HOST:-host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway" # нужно для Linux-хостов, на Windows Docker Desktop работает и так
    ports:
      - "8099:8080"   # host:8099 -> container:8080 (8080/8081/8082/8085/8088 у вас уже заняты)
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      VITE_API_URL: http://localhost:8099
    ports:
      - "5180:5173"   # host:5180 -> container:5173
    depends_on:
      - backend

volumes:
  postgres_data:
